# Load once in the http context. Both hostnames and download aliases use one key.
map "$request_method:$uri" $zip_download_pool {
    default "";
    ~^GET:/api/resources/file/archives/[^/]+/$ zip;
    ~^GET:/api/resources/archives/[^/]+/download/$ zip;
}
limit_conn_zone $zip_download_pool zone=zip_downloads:1m;
