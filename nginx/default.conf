map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Resolve the optional analytics service at request time, so an unavailable
    # Umami service cannot prevent the gateway from starting.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $statistics_backend http://umami:3000;

    location = /_site/client.js {
        proxy_pass $statistics_backend/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache" always;
    }

    # The tracker derives its collector URL from the script's directory.
    location = /_site/api/send {
        client_max_body_size 16k;
        proxy_pass $statistics_backend/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        # Outer OpenResty overwrites X-Real-IP; do not trust a visitor's XFF.
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }

    # Stream resource downloads without buffering large files to proxy temp disk.
    location /api/resources/file/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location = /api/upload/ {
        client_max_body_size 26m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Covers both create and /api/upload/request/<id>/ edit requests.
    location ^~ /api/upload/request/ {
        client_max_body_size 1025m;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /api/management/resources/upload/ {
        client_max_body_size 2g;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django Admin remains available as the Passkey-gated emergency console.
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /srv/django-static/;
        access_log off;
        expires 7d;
    }

    # Resource documents and discovery endpoints must not fall back to index.html.
    location ~ ^/(disk(?:/|$)|robots\.txt$|sitemap\.xml$) {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_intercept_errors off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # These stable files point to this release's hashed JS/CSS assets.
    location ~ ^/resource-entry\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Pending uploads are private and must only be read through authenticated APIs.
    location ^~ /media/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /manage {
        try_files /index.html =404;
        # KeePassXC-Browser installs its WebAuthn bridge as a page script.
        # Replace only the management document's meta policy; public pages keep
        # the stricter policy embedded in index.html.
        sub_filter "script-src 'self';" "script-src 'self' moz-extension: chrome-extension:;";
        sub_filter_once on;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "publickey-credentials-create=(self), publickey-credentials-get=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' moz-extension: chrome-extension:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location ^~ /manage/ {
        try_files /index.html =404;
        sub_filter "script-src 'self';" "script-src 'self' moz-extension: chrome-extension:;";
        sub_filter_once on;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "publickey-credentials-create=(self), publickey-credentials-get=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' moz-extension: chrome-extension:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
