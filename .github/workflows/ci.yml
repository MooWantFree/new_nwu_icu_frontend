name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_commit:
        description: Full 40-character backend commit with a published GHCR image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.backend_commit }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable locked pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript checks
        run: pnpm typecheck
      - name: Run ESLint
        run: pnpm lint
      - name: Run all unit tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build

  publish:
    name: Publish gateway image for a fixed backend
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and validate the backend image
        id: release
        env:
          BACKEND_COMMIT: ${{ inputs.backend_commit }}
          FRONTEND_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Use a full lowercase backend commit SHA.' >&2; exit 1; }
          backend_repository=ghcr.io/nwuca/nwu.icu
          backend_tag="$backend_repository:sha-$BACKEND_COMMIT"
          docker pull --platform linux/amd64 "$backend_tag"
          revision=$(docker image inspect "$backend_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "$revision" == "$BACKEND_COMMIT" ]] || { echo 'Backend image revision mismatch.' >&2; exit 1; }
          backend_image=$(docker image inspect "$backend_tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -E "^$backend_repository@sha256:[0-9a-f]{64}$")
          [[ -n "$backend_image" && "$backend_image" != *$'\n'* ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:sha-$FRONTEND_COMMIT-backend-$BACKEND_COMMIT"
          printf 'backend_image=%s\nimage=%s\n' "$backend_image" "$image" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish gateway
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}
          build-args: |
            FRONTEND_COMMIT=${{ github.sha }}
            BACKEND_COMMIT=${{ inputs.backend_commit }}
            FRONTEND_GITHUB_URL=https://github.com/${{ github.repository }}
            BACKEND_GITHUB_URL=https://github.com/NWUCA/NWU.ICU
            BACKEND_IMAGE=${{ steps.release.outputs.backend_image }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Record the fixed release images
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          GATEWAY_TAG: ${{ steps.release.outputs.image }}
          GATEWAY_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### Images ready for server pull'
            printf '\nBackend: `%s`\n' "$BACKEND_IMAGE"
            printf '\nGateway: `%s@%s`\n' "${GATEWAY_TAG%%:*}" "$GATEWAY_DIGEST"
            echo 'No production deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
